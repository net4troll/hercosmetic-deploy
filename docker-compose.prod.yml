name: hercosmetic

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hercosmetic
      POSTGRES_PASSWORD: hercosmetic
      POSTGRES_DB: hercosmetic
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hercosmetic -d hercosmetic"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot : migrations Prisma appliquees a chaque deploiement (idempotent).
  migrate:
    image: ghcr.io/net4troll/hercosmetic-migrate:latest
    restart: "no"
    environment:
      DATABASE_URL: postgres://hercosmetic:hercosmetic@postgres:5432/hercosmetic
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/net4troll/hercosmetic-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hercosmetic:hercosmetic@postgres:5432/hercosmetic
      PORT: 3003
    volumes:
      - product-images:/app/apps/api/data/product-images
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.hc-api.rule=Host(`ffq9esa4ahq8cc84ynyi9ku7.tqdm.online`) && PathPrefix(`/api`)
      - traefik.http.routers.hc-api.entrypoints=http,https
      - traefik.http.routers.hc-api.tls.certresolver=letsencrypt
      - traefik.http.routers.hc-api.priority=30
      - traefik.http.services.hc-api.loadbalancer.server.port=3003

  pos:
    image: ghcr.io/net4troll/hercosmetic-pos:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      API_URL: http://api:3003
    depends_on:
      - api
    labels:
      - traefik.enable=true
      - traefik.http.routers.hc-pos.rule=Host(`ffq9esa4ahq8cc84ynyi9ku7.tqdm.online`) && (PathPrefix(`/pos`) || Path(`/login`) || Path(`/settings`) || Path(`/stock`) || Path(`/orders`))
      - traefik.http.routers.hc-pos.entrypoints=http,https
      - traefik.http.routers.hc-pos.tls.certresolver=letsencrypt
      - traefik.http.routers.hc-pos.priority=20
      - traefik.http.services.hc-pos.loadbalancer.server.port=3000

  admin:
    image: ghcr.io/net4troll/hercosmetic-admin:latest
    restart: unless-stopped
    environment:
      PORT: 3001
      API_URL: http://api:3003
    depends_on:
      - api
    labels:
      - traefik.enable=true
      - traefik.http.routers.hc-admin.rule=Host(`ffq9esa4ahq8cc84ynyi9ku7.tqdm.online`) && PathPrefix(`/admin`)
      - traefik.http.routers.hc-admin.entrypoints=http,https
      - traefik.http.routers.hc-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.hc-admin.priority=20
      - traefik.http.services.hc-admin.loadbalancer.server.port=3001

  store:
    image: ghcr.io/net4troll/hercosmetic-store:latest
    restart: unless-stopped
    environment:
      PORT: 3002
      DATABASE_URL: postgres://hercosmetic:hercosmetic@postgres:5432/hercosmetic
      API_URL: http://api:3003
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.hc-store.rule=Host(`ffq9esa4ahq8cc84ynyi9ku7.tqdm.online`)
      - traefik.http.routers.hc-store.entrypoints=http,https
      - traefik.http.routers.hc-store.tls.certresolver=letsencrypt
      - traefik.http.routers.hc-store.priority=10
      - traefik.http.services.hc-store.loadbalancer.server.port=3002

volumes:
  pgdata:
  product-images:
