name: hercosmetic

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hercosmetic
      POSTGRES_PASSWORD: hercosmetic
      POSTGRES_DB: hercosmetic
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hercosmetic -d hercosmetic"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot : migrations Prisma appliquees a chaque deploiement (idempotent).
  migrate:
    image: ghcr.io/net4troll/hercosmetic-migrate:latest
    restart: "no"
    environment:
      DATABASE_URL: postgres://hercosmetic:hercosmetic@postgres:5432/hercosmetic
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/net4troll/hercosmetic-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hercosmetic:hercosmetic@postgres:5432/hercosmetic
      PORT: 3003
    volumes:
      - product-images:/app/apps/api/data/product-images
    depends_on:
      postgres:
        condition: service_healthy

  pos:
    image: ghcr.io/net4troll/hercosmetic-pos:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      API_URL: http://api:3003
    depends_on:
      - api

  admin:
    image: ghcr.io/net4troll/hercosmetic-admin:latest
    restart: unless-stopped
    environment:
      PORT: 3001
      API_URL: http://api:3003
    depends_on:
      - api

  store:
    image: ghcr.io/net4troll/hercosmetic-store:latest
    restart: unless-stopped
    environment:
      PORT: 3002
      DATABASE_URL: postgres://hercosmetic:hercosmetic@postgres:5432/hercosmetic
      API_URL: http://api:3003
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  product-images:
